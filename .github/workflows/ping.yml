name: Ping Server

on:
  schedule:
    - cron: '*/5 14-23,0-7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        run: |
          curl -L -f -sS --max-time 120 -o /dev/null \
            -w "Status: %{http_code} | Time: %{time_total}s\n" \
            "${{ secrets.SERVER_URL }}"
