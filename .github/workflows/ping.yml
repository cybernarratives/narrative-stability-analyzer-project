name: Ping Server

on:
  schedule:
    - cron: '2-57/5 6-23 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        run: |
          curl -L -f -sS --max-time 120 -o /dev/null \
            -w "Status: %{http_code} | Time: %{time_total}s\n" \
            "${{ secrets.SERVER_URL }}"
