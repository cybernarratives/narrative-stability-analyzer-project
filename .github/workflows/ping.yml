name: Ping Server

on:
  schedule:
    # Runs every 5 minutes from 6:00 AM to 11:55 PM PST (14:00 to 07:55 UTC)
    - cron: '*/5 14-23,0-7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        run: |
          curl -L -f -s -o /dev/null -w "Status: %{http_code} | Time: %{time_total}s\n" "${{ secrets.SERVER_URL }}"
