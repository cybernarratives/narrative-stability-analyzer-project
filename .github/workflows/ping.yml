name: Ping Server

on:
  schedule:
    # Runs every 5 minutes (the shortest interval GitHub allows)
    - cron: '*/5 * * * *'
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        run: |
          curl -f -s -o /dev/null "${{ secrets.SERVER_URL }}"
